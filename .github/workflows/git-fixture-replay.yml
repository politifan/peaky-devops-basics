name: Published Git fixture exact replay
on:
  workflow_dispatch:
  push:
    branches: [codex/devops-quality-20261023]
    paths:
      - qa/git-fixture-replay/**
      - .github/workflows/git-fixture-replay.yml
permissions:
  contents: read
jobs:
  replay:
    if: github.ref == 'refs/heads/codex/devops-quality-20261023'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pure guard regression
        run: python3 qa/git-fixture-replay/test_git_replay.py
      - name: Fetch immutable-checksummed published fixture
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 60 --output "$RUNNER_TEMP/practice-v5.tar.gz" https://github.com/politifan/peaky-devops-basics/releases/download/course-v5-final/practice-v5.tar.gz
          printf '%s  %s\n' dc6d40153e4d7100a922d01897e30707920cb3ba4a6148a248c0005a7e6f8dcb "$RUNNER_TEMP/practice-v5.tar.gz" | sha256sum -c -
      - name: Exact published prepare and selected Git commands
        shell: bash
        run: |
          set -euo pipefail
          bash qa/git-fixture-replay/git-fixture-replay.sh "$RUNNER_TEMP/practice-v5.tar.gz" 2>&1 | tee "$RUNNER_TEMP/git-fixture-trace.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: published-git-fixture-trace
          path: ${{ runner.temp }}/git-fixture-trace.txt
          if-no-files-found: warn
          retention-days: 7
