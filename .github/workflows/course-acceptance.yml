name: Patched source full lab acceptance
on:
  push:
    branches: [codex/devops-quality-20261023]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  course-route:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Require disposable local runner boundaries
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          for name in DOCKER_HOST DOCKER_CONTEXT COMPOSE_FILE TICKETLAB_IMAGE PEAKY_AUTHOR_PROBE_SSH; do
            test -z "${!name:-}" || { echo "Unexpected external configuration: $name"; exit 1; }
          done
          test "$(docker context show)" = default
          docker info --format '{{.Name}}'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: runtime/go.mod
          cache-dependency-path: runtime/go.sum
      - name: Build the patched learner kit from this commit
        run: |
          mkdir -p "$HOME/course-acceptance-kit"
          cd runtime
          CGO_ENABLED=0 go build -trimpath -ldflags "-X main.sourceRevision=$GITHUB_SHA -X main.releaseVersion=3.0.0-good" -o "$HOME/course-acceptance-kit/ticketlab" .
          CGO_ENABLED=0 go build -trimpath -ldflags "-X main.sourceRevision=$GITHUB_SHA -X main.releaseVersion=3.0.0-bad-write -X main.defect=bad-write" -o "$HOME/course-acceptance-kit/ticketlab-bad-write" .
          CGO_ENABLED=0 go build -trimpath -ldflags "-X main.sourceRevision=$GITHUB_SHA -X main.releaseVersion=3.0.0-bad-body -X main.defect=bad-body" -o "$HOME/course-acceptance-kit/ticketlab-bad-body" .
          CGO_ENABLED=0 go build -trimpath -ldflags "-X main.sourceRevision=$GITHUB_SHA -X main.releaseVersion=3.0.0-bad-retry -X main.defect=bad-retry" -o "$HOME/course-acceptance-kit/ticketlab-bad-retry" .
          cd ..
          cp "$HOME/course-acceptance-kit/ticketlab" "$HOME/course-acceptance-kit/labcheck"
          cp "$HOME/course-acceptance-kit/ticketlab" "$HOME/course-acceptance-kit/labctl"
          cp README.md Dockerfile compose.yaml "$HOME/course-acceptance-kit/"
          cp -r practice "$HOME/course-acceptance-kit/"
          (cd "$HOME/course-acceptance-kit" && sha256sum ticketlab ticketlab-bad-* labcheck labctl > SHA256SUMS)
      - name: Positive and negative lab route
        run: |
          docker pull postgres@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
          git config --global user.name 'Course verification'
          git config --global user.email 'course-verification@example.invalid'
          bash qa/route-acceptance.sh "ci-$GITHUB_RUN_ID" "$HOME/course-acceptance-kit" > course-route.log 2>&1
      - name: Report failure location
        if: failure()
        run: tail -n 100 course-route.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: full-course-route-evidence
          path: |
            course-route.log
            ~/peaky-labs/ci-*/**/results.tsv
          retention-days: 30
