name: Isolated basic source verification
on:
  push:
    branches: [codex/devops-quality-20261023]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Require disposable local runner boundaries
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          for name in DOCKER_HOST DOCKER_CONTEXT COMPOSE_FILE TICKETLAB_IMAGE PEAKY_AUTHOR_PROBE_SSH; do
            test -z "${!name:-}" || { echo "Unexpected external configuration: $name"; exit 1; }
          done
          test "$(docker context show)" = default
          docker info --format '{{.Name}}'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: runtime/go.mod
          cache-dependency-path: runtime/go.sum
      - name: Verify command examples
        run: bash practice/verify-command-examples.sh | tee command-examples.txt
      - name: Runtime tests
        working-directory: runtime
        run: go test ./...
      - name: Build fixed artifacts
        run: |
          mkdir -p dist reports
          cd runtime
          CGO_ENABLED=0 go build -trimpath -ldflags "-X main.sourceRevision=$GITHUB_SHA -X main.releaseVersion=3.0.0-good" -o ../dist/ticketlab .
          CGO_ENABLED=0 go build -trimpath -ldflags "-X main.sourceRevision=$GITHUB_SHA -X main.releaseVersion=3.0.0-bad-write -X main.defect=bad-write" -o ../dist/ticketlab-bad-write .
          CGO_ENABLED=0 go build -trimpath -ldflags "-X main.sourceRevision=$GITHUB_SHA -X main.releaseVersion=3.0.0-bad-body -X main.defect=bad-body" -o ../dist/ticketlab-bad-body .
          CGO_ENABLED=0 go build -trimpath -ldflags "-X main.sourceRevision=$GITHUB_SHA -X main.releaseVersion=3.0.0-bad-retry -X main.defect=bad-retry" -o ../dist/ticketlab-bad-retry .
          cp ../dist/ticketlab ../dist/labcheck
          cp ../dist/ticketlab ../dist/labctl
          cd ..
          cp dist/ticketlab ticketlab
      - name: Positive and negative HTTP scenarios
        run: bash scripts/check-runtime.sh
      - name: Build and inspect container
        run: |
          docker build --label org.opencontainers.image.revision="$GITHUB_SHA" -t ticketlab:check .
          bash scripts/check-container.sh
      - name: Backup and restore real PostgreSQL
        run: bash scripts/check-postgres.sh
      - name: Prepare download
        run: |
          cp README.md Dockerfile compose.yaml dist/
          cp -r practice dist/
          (cd dist && sha256sum ticketlab ticketlab-bad-* labcheck labctl > SHA256SUMS)
          tar -czf ticketlab-linux-amd64.tar.gz -C dist .
          docker save ticketlab:check | gzip > ticketlab-image.tar.gz
          sha256sum ticketlab-linux-amd64.tar.gz ticketlab-image.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: course-kit-and-evidence
          path: |
            ticketlab-linux-amd64.tar.gz
            ticketlab-image.tar.gz
            command-examples.txt
            SHA256SUMS
            reports/
          retention-days: 14
