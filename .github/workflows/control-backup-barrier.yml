# Separate candidate; root approval required before quality-branch push.
name: Disposable m10 backup barrier
on:
  workflow_dispatch:
  push:
    branches: [codex/devops-quality-20261023]
    paths:
      - qa/control-backup-barrier/**
      - .github/workflows/control-backup-barrier.yml
permissions:
  contents: read
jobs:
  backup-barrier:
    if: github.ref == 'refs/heads/codex/devops-quality-20261023'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require approved initial matrix terminal green
        run: |
          python3 - <<'PY'
          import json, urllib.request
          base='https://api.github.com/repos/politifan/peaky-devops-basics/actions/runs/40079830008'
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers={'Accept':'application/vnd.github+json','User-Agent':'control-barrier-readonly-gate'}),timeout=20) as r:
                  return json.load(r)
          run=get(base)
          assert run['head_sha']=='6b98e82937760015ca3b2490ae9559c82432f58b'
          assert run['head_branch']=='codex/devops-quality-20261023'
          assert run['path']=='.github/workflows/disposable-controls.yml'
          assert run['status']=='completed' and run['conclusion']=='success'
          jobs=get(base+'/jobs?per_page=100')['jobs']
          assert len(jobs)==11 and all(j['status']=='completed' and j['conclusion']=='success' for j in jobs)
          assert {j['name'] for j in jobs}=={f'setup ({n})' for n in (1,2,3,4,5,6,7,8,10,11,12)}
          print('Approved initial matrix: all 11 terminal success')
          PY
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: runtime/go.mod
          cache-dependency-path: runtime/go.sum
      - name: Build exact checkout kit
        working-directory: runtime
        run: |
          mkdir -p "$RUNNER_TEMP/kit"
          CGO_ENABLED=0 go build -trimpath -ldflags "-X main.sourceRevision=$GITHUB_SHA -X main.releaseVersion=3.0.0-good" -o "$RUNNER_TEMP/kit/ticketlab" .
          cp "$RUNNER_TEMP/kit/ticketlab" "$RUNNER_TEMP/kit/labctl"
          cp "$RUNNER_TEMP/kit/ticketlab" "$RUNNER_TEMP/kit/labcheck"
      - name: Fresh initial m10, then separate backup and teacher barrier
        env:
          CONTROL_DIAGNOSTICS: ${{ runner.temp }}/control-barrier-diagnostics.jsonl
          PYTHONPATH: qa/control-provision
        run: |
          python3 -m unittest discover -s qa/control-backup-barrier -p test_m10_barrier.py -v
          sha=$(sha256sum "$RUNNER_TEMP/kit/ticketlab" | cut -d ' ' -f1)
          python3 qa/control-provision/control_provision.py 10 --root "$RUNNER_TEMP/barrier-root" --kit "$RUNNER_TEMP/kit" --kit-sha256 "$sha" --execute --confirm-control control10-a
          python3 qa/control-provision/assert_setup.py 10 "$RUNNER_TEMP/barrier-root" "$RUNNER_TEMP/kit"
          python3 qa/control-backup-barrier/m10_barrier_harness.py --root "$RUNNER_TEMP/barrier-root" --kit "$RUNNER_TEMP/kit" --execute --confirm-control control10-a
      - name: Retain allowlisted barrier diagnostics only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m10-backup-barrier-diagnostics
          path: ${{ runner.temp }}/control-barrier-diagnostics.jsonl
          if-no-files-found: warn
          retention-days: 7
